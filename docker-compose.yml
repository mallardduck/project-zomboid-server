version: "3"

services:
  main-server:
    container_name: zomboid_app
    build: .
    restart: always
    environment:
      - SERVER_RAM=16g
      # Uncomment to stay on the legacy B41 branch, or leave blank for B42 stable.
      # - STEAM_BETA_BRANCH=legacy41
    volumes:
      - zomboid_app:/home/steam/project-zomboid-dedicated/:rw

volumes:
    zomboid_app:
        external: true
